<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
<defs>
<linearGradient id="room" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#120f24"/><stop offset="1" stop-color="#1d1838"/></linearGradient>
<linearGradient id="cone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2c9" stop-opacity=".55"/><stop offset="1" stop-color="#ffb533" stop-opacity="0"/></linearGradient>
<radialGradient id="pool" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd27a" stop-opacity=".55"/><stop offset="1" stop-color="#ffb533" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="420" fill="url(#room)"/>
<!-- ceiling -->
<rect x="0" y="0" width="1200" height="24" fill="#0b0918"/>
<!-- floor in perspective -->
<path d="M0 420 L240 300 L960 300 L1200 420 Z" fill="#17132c"/>
<g stroke="#2a2547" stroke-width="1">
<path d="M360 300 L240 420"/><path d="M480 300 L440 420"/><path d="M600 300 L600 420"/><path d="M720 300 L760 420"/><path d="M840 300 L960 420"/>
<path d="M200 320 L1000 320"/><path d="M150 345 L1050 345"/><path d="M90 375 L1110 375"/>
</g>
<!-- four LEDs with light cones, each flickering with its own tone -->
<g>
<path d="M300 26 L170 330 L430 330 Z" fill="url(#cone)"><animate attributeName="opacity" values=".7;1;.7" dur="0.9s" repeatCount="indefinite"/></path>
<path d="M500 26 L380 330 L620 330 Z" fill="url(#cone)"><animate attributeName="opacity" values=".7;1;.7" dur="1.3s" repeatCount="indefinite"/></path>
<path d="M700 26 L580 330 L820 330 Z" fill="url(#cone)"><animate attributeName="opacity" values=".7;1;.7" dur="1.1s" repeatCount="indefinite"/></path>
<path d="M900 26 L770 330 L1030 330 Z" fill="url(#cone)"><animate attributeName="opacity" values=".7;1;.7" dur="1.6s" repeatCount="indefinite"/></path>
</g>
<g filter="url(#glow)" fill="#fff6dd">
<rect x="280" y="18" width="40" height="10" rx="3"/><rect x="480" y="18" width="40" height="10" rx="3"/><rect x="680" y="18" width="40" height="10" rx="3"/><rect x="880" y="18" width="40" height="10" rx="3"/>
</g>
<g font-family="Consolas, monospace" font-size="12" fill="#ffb533" text-anchor="middle">
<text x="300" y="46">f₁</text><text x="500" y="46">f₂</text><text x="700" y="46">f₃</text><text x="900" y="46">f₄</text>
</g>
<!-- phone moving on the floor, with its estimated position -->
<g>
<animateTransform attributeName="transform" type="translate" values="0 0;260 18;520 -6;260 30;0 0" dur="10s" repeatCount="indefinite"/>
<ellipse cx="350" cy="352" rx="70" ry="16" fill="url(#pool)"/>
<rect x="336" y="334" width="28" height="18" rx="3" fill="#2c2550" stroke="#fff6dd" stroke-width="1.5"/>
<rect x="344" y="338" width="12" height="3" fill="#4dd9ff"/>
<g stroke="#ff6690" stroke-width="2" fill="none"><circle cx="350" cy="343" r="16"><animate attributeName="r" values="22;12;22" dur="2s" repeatCount="indefinite"/></circle><path d="M350 321 V331 M350 355 V365 M328 343 H338 M362 343 H372"/></g>

</g>
<text x="40" y="96" font-family="Segoe UI, Helvetica, Arial" font-size="38" font-weight="800" fill="#fbf4e6">The lights know</text>
<text x="40" y="134" font-family="Segoe UI, Helvetica, Arial" font-size="38" font-weight="800" fill="#fbf4e6">where you are</text>
<text x="42" y="168" font-family="Segoe UI, Helvetica, Arial" font-size="16" fill="#ffb533">visible-light positioning</text>
<text x="42" y="214" font-family="Consolas, monospace" font-size="14" fill="#a8a1c2">1.0 cm  max. likelihood, direct light</text>
<text x="42" y="236" font-family="Consolas, monospace" font-size="14" fill="#a8a1c2">30 cm  same, with wall reflections</text>
<text x="42" y="258" font-family="Consolas, monospace" font-size="14" fill="#ffb533">2.0 cm  fingerprinting, with reflections</text>
</svg>
